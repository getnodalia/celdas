[package]
name = "celdas-web"
description = "Celdas in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "celdas-web"
path = "src/main.rs"

[dependencies]
celdas-engine = { workspace = true }
celdas-ui-egui = { workspace = true }
# The host messages (getnodalia/foundation (vendor/nodalia-libs)): one contract and one bridge for the web builds.
# The page command API: window.celdas over the control channel.
nodalia-web-api = { git = "https://github.com/getnodalia/foundation", rev = "16e018374e1d87587e1ff60319a1ebd63cf947c0", version = "0.1.0" }
nodalia-web-host = { git = "https://github.com/getnodalia/foundation", rev = "16e018374e1d87587e1ff60319a1ebd63cf947c0", version = "0.1.0" }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator", "MessageEvent", "UrlSearchParams", "AddEventListenerOptions", "Storage", "CustomEvent", "CustomEventInit"] }
