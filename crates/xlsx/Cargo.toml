[package]
name = "celdas-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Celdas file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
celdas-core = { workspace = true }
celdas-formula = { workspace = true }
celdas-math = { workspace = true }
celdas-model = { workspace = true }
nodalia-cfb = { workspace = true }
nodalia-csv = { workspace = true }
nodalia-offcrypto = { workspace = true }
nodalia-opc = { workspace = true }
nodalia-xls = { workspace = true }
nodalia-xml = { workspace = true }
nodalia-xlsx = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Every registered function name, for the formula file-spelling test.
celdas-functions = { workspace = true }
