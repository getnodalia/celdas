[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/celdas", "apps/celdas-cli", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/getnodalia/celdas"

[workspace.dependencies]
# internal
celdas-core = { path = "crates/core" }
celdas-numfmt = { path = "crates/numfmt" }
celdas-vba = { path = "crates/vba" }
celdas-sandbox = { path = "crates/sandbox" }
celdas-formula = { path = "crates/formula" }
celdas-functions = { path = "crates/functions" }
celdas-model = { path = "crates/model" }
celdas-calc = { path = "crates/calc" }
celdas-xlsx = { path = "crates/xlsx" }
celdas-chart = { path = "crates/chart" }
celdas-engine = { path = "crates/engine" }
celdas-ui-egui = { path = "crates/ui-egui" }
celdas-mcp = { path = "crates/mcp" }
celdas-pdf = { path = "crates/pdf" }
celdas-math = { path = "crates/math" }
# Every nodalia-libs crate (nodalia-window and the file-format crates here, nodalia-ui in
# ui-egui, nodalia-print in the app, nodalia-web-api and nodalia-web-host in the web app) comes from one
# nodalia-libs revision.
# In-app updates from this app's GitHub releases, with the update windows for egui.
nodalia-update = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2", features = ["egui"] }
# Nodalia Design for egui: the palette, Celdas's accent, the icon set and the window controls.
nodalia-theme = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "44bfd0a37e6bd2837c473b4e5607b70e8d169e61", features = ["egui", "creator"] }
# PDF RunLength encoding; this revision also fixes the vendored JBIG2 dependency for Git consumers.
nodalia-pdf = { git = "https://github.com/getnodalia/foundation", rev = "a2a0bb63def6bf4bbb74562dc7462983f3aa13df", version = "0.1.0", default-features = false }
nodalia-stream-codecs = { git = "https://github.com/getnodalia/foundation", rev = "2fb829b020925c63593aec1ac1b0880c55b3f96a", version = "0.1.0" }
# Compound files ([MS-CFB]) and password-encrypted OOXML packages ([MS-OFFCRYPTO]).
nodalia-cfb = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
nodalia-offcrypto = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
# Legacy 8-bit code pages (Mac OS Roman, Windows pages): a VBA project stores its source in one.
nodalia-codepage = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
# OPC zip packages (parts, relationships, the zip writer) under `crates/xlsx/src/package.rs`.
nodalia-opc = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
# Delimited text (CSV, TSV) and SYLK; `crates/xlsx/src/csv.rs` and `crates/engine/src/io/sylk.rs`
# turn them into workbooks.
nodalia-csv = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
# The native JSON workbook (`.json`, `.scjson`): read, written, and kept newer macros written back.
nodalia-celdas-format = { git = "https://github.com/getnodalia/foundation", rev = "d68f03caf6b9fa5db01ab7d62fc5720d17ebf37f", version = "0.1.0" }
# Excel 97-2003 (.xls, BIFF8) workbooks; `crates/xlsx/src/xls.rs` maps them onto the model.
# SpreadsheetML string encoding/decoding; workbook model mapping stays in celdas-xlsx.
nodalia-xlsx = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
nodalia-xml = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }
nodalia-xls = { git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", version = "0.1.0" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
web-time = "1.1.0"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# equations: RaTeX (MIT) lays LaTeX out as positioned glyphs, rules and paths. Exact pins: it is
# young (0.1.x), and the gate recorded in docs/decisions.md vetted this release.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
# The desktop's preferred language, for the first-run interface language (native only).
sys-locale = "0.3"
# Font parser egui's epaint uses; the UI validates system font files with it before handing them
# to egui, which panics on a file it can't parse. Same version as epaint's, so no second copy.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Real font bytes for tests (Ubuntu Light, compiled into epaint).
epaint_default_fonts = "0.37"
# One native window per workbook: the window list, Window menu titles and the immediate-viewport
# driver. Same nodalia-libs revision as the other nodalia-libs crates.
nodalia-window = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "57933793e2a2ef8904338640547fdfd673cbc0f9", default-features = false, features = ["egui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/getnodalia/foundation", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
